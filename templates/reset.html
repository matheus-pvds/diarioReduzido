<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova senha - O Diário Reduzido</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Crimson+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <style>
        :root { --paper-color: #f9f7f1; --ink-color: #1a1a1a; --border-light: #ccc; --accent-red: #a00; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #e0ddd5; color: var(--ink-color); font-family: 'Crimson Pro', serif; line-height: 1.5; padding: 2rem 1rem; }
        .container { max-width: 400px; margin: 0 auto; background-color: var(--paper-color); padding: 3rem; box-shadow: 0 10px 30px rgba(0,0,0,0.15); min-height: 60vh; border: 1px solid #ddd; margin-top: 10vh; text-align: center; }
        h1 { font-family: 'Playfair Display', serif; font-size: 2rem; margin-bottom: 0.5rem; }
        .sub { font-size: 0.9rem; color: #666; margin-bottom: 1.5rem; font-style: italic; }
        .form-group { margin-bottom: 1.5rem; text-align: left; }
        label { display: block; font-weight: bold; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.3rem; }
        input { width: 100%; padding: 0.7rem; font-family: 'Crimson Pro', serif; font-size: 1rem; border: 1px solid var(--border-light); background: white; }
        button { background: var(--ink-color); color: white; border: none; padding: 0.7rem 2rem; font-family: 'Playfair Display', serif; font-size: 1rem; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
        button:hover { background: var(--accent-red); }
        .error { color: var(--accent-red); margin-bottom: 1rem; font-style: italic; }
        .back-link { display: block; margin-top: 2rem; font-size: 0.9rem; color: #666; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Nova senha</h1>
        <p class="sub">Escolha uma nova senha para sua conta</p>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="form-group">
                <label for="password">Nova senha</label>
                <input type="password" id="password" name="password" required minlength="4" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirmar senha</label>
                <input type="password" id="confirm_password" name="confirm_password" required minlength="4" autocomplete="off">
            </div>
            <button type="submit">Redefinir</button>
        </form>
        <a href="/" class="back-link">Voltar ao início</a>
    </div>
</body>
</html>
