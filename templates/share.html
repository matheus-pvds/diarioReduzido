<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Compartilhar</title>
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ title }}">
    <meta name="twitter:description" content="{{ summary }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Crimson+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <style>
        :root { --paper-color: #f9f7f1; --ink-color: #1a1a1a; --border-light: #ccc; --accent-red: #a00; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #e0ddd5; color: var(--ink-color); font-family: 'Crimson Pro', serif; line-height: 1.5; padding: 2rem 1rem; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { max-width: 550px; width: 100%; background: var(--paper-color); padding: 3rem; box-shadow: 0 10px 30px rgba(0,0,0,0.15); border: 1px solid #ddd; text-align: center; }
        h1 { font-family: 'Playfair Display', serif; font-size: 2rem; margin-bottom: 0.5rem; line-height: 1.2; }
        .meta { font-size: 0.9rem; color: #666; margin-bottom: 1.5rem; font-style: italic; }
        .summary { font-size: 1.15rem; text-align: justify; margin-bottom: 2rem; line-height: 1.6; }
        .btn { display: inline-block; background: var(--ink-color); color: #fff; text-decoration: none; padding: 0.7rem 2rem; font-family: 'Playfair Display', serif; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 1px; transition: background 0.2s; }
        .btn:hover { background: var(--accent-red); }
        .btn-twitter { background: #1DA1F2; margin-left: 0.5rem; }
        .btn-twitter:hover { background: #0d8bd9; }
        .footer { margin-top: 2rem; font-size: 0.75rem; color: #888; }
        .footer a { color: var(--accent-red); }
    </style>
</head>
<body>
    <div class="card">
        <h1>{{ title }}</h1>
        <div class="meta">{{ post.date.strftime('%d/%m/%Y') if post.date else '' }}</div>
        <div class="summary">{{ summary }}</div>
        <div>
            <a href="{{ article_url }}" class="btn" target="_blank">Ler artigo completo</a>
            <a href="https://twitter.com/intent/tweet?text={{ (title ~ ' - ' ~ summary)|urlencode }}&url={{ article_url|urlencode }}" class="btn btn-twitter" target="_blank">Compartilhar no Twitter</a>
        </div>
        <div class="footer">
            <a href="/">O Diário Reduzido</a> &mdash; A síntese do Diário Oficial de GV
        </div>
    </div>
</body>
</html>
